name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - name: Lint
        run: ruff check .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb
      - name: Install the package with test extras
        run: pip install -e ".[dev,gui]"
      - name: Run the test suite
        if: runner.os != 'Linux'
        run: pytest -q
      - name: Run the test suite (headless Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Dataset fingerprint
        run: python scripts/check_dataset_fingerprint.py
      - name: Train the model (for the quality gate)
        if: runner.os == 'Linux'
        run: python -m minipcai.train
      - name: Golden hard set (0 wrong accepts, <=8% unnecessary rejects)
        if: runner.os == 'Linux'
        run: python scripts/check_golden_hard.py --sweep

  packaging:
    name: packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: The artifacts must ship the application data
        run: python scripts/check_wheel_contents.py
      - name: Install the wheel into a clean venv and use it
        run: python scripts/smoke_installed.py
