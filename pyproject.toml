[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minipcai"
version = "0.2.0"
description = "MiniPCAI: a small, self-trained German-language assistant for safe Windows PC actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MiniPCAI contributors" }]
keywords = ["assistant", "intent-classification", "windows", "german"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
# The desktop UI is optional: the CLI works without Qt.
gui = [
    "PySide6>=6.5",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/jonas050210/MiniPCAI"
Issues = "https://github.com/jonas050210/MiniPCAI/issues"

[project.scripts]
minipcai = "minipcai.cli:main"
minipcai-train = "minipcai.train:main"

[tool.setuptools]
packages = ["minipcai", "minipcai.ui"]
license-files = ["LICENSE"]

# The registry and the versioned dataset are *data of the application*, not
# test fixtures: an installed wheel must be able to train and to resolve
# targets without the repository.
[tool.setuptools.package-data]
minipcai = [
    "data/registry.json",
    "data/intent_dataset.v*.jsonl",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The dataset generator is a build tool with long template literals.
"scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
